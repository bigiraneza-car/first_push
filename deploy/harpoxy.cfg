frontend http_front
    bind *:80
    mode http 
    http-request redirect scheme https code 301

frontend https_front
    bind *:443 ssl crt /etc/haproxy/certs/www.bigiraneza.tech.pem
    mode http
    http-request add-header X-Forwarded_Proto https
    default_backend http_back

backend http_back
    balance roundrobin
    server 1128579250-web-01 18.130.48.38:80 check
    server 1128579250-web-02 16.61.221.255:80 check