server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/firstpush;
    index index.html;

    add_header X-Served-By $hostname;

    location ~ /\.git { 
        deny all;  
    }
    location /deploy/ {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

}